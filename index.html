<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the field runs under a phone's notch and home
         indicator; the chrome that has to stay clear of them uses
         env(safe-area-inset-*) instead of a blanket inset. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ececec" />
    <meta name="color-scheme" content="light dark" />
    <title>Ambient Orchestra</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <canvas id="visualizer"></canvas>
    <div id="view-toggle" class="view-toggle-slot" hidden></div>
    <!--
      The dock.

      On a wide screen it is `display: contents` — it generates no box at all,
      and the rails, the play stage and the mode switch stay exactly where they
      were, fixed to their own edges. Narrow enough that two 268px rails cannot
      both stand beside the field, it becomes a real element: one bottom sheet
      holding the mode switch, a tab bar, and whichever panel the tabs choose.
      Same DOM, same widgets, one reparenting-free switch between the two
      layouts.
    -->
    <div id="dock" class="dock">
      <div id="mode-toggle" class="mode-toggle-slot" hidden></div>
      <div id="dock-bar" class="dock-bar" hidden>
        <div id="dock-tabs" class="dock-tabs" role="tablist" aria-label="Panel"></div>
        <button
          id="dock-collapse"
          class="dock-collapse"
          type="button"
          aria-expanded="true"
        >
          Hide
        </button>
      </div>
      <aside id="rail-left" class="rail rail-left" hidden>
        <div class="rail-head"><span class="rail-title">Audio</span></div>
        <div id="rail-left-data" class="rail-data"></div>
        <div id="rail-left-knobs" class="rail-knobs"></div>
      </aside>
      <aside id="rail-right" class="rail rail-right" hidden>
        <div class="rail-head"><span class="rail-title">Visual</span></div>
        <div id="rail-right-data" class="rail-data"></div>
        <div id="rail-right-knobs" class="rail-knobs"></div>
      </aside>
      <div id="play-stage" class="play-stage" hidden></div>
    </div>
    <div id="overlay" class="overlay">
      <button id="start-btn" type="button">Click to begin</button>
    </div>
    <div id="error-overlay" class="error-overlay hidden">
      <p id="error-message"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
